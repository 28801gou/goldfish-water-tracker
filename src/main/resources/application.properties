spring.application.name=goldfish-app
# 接続先URL（Docker Compose で動かすサービス名 "db" をホスト名に指定）
spring.datasource.url=jdbc:postgresql://db:5432/goldfish_db
spring.datasource.username=goldfish_user
spring.datasource.password=goldfish_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate設定（Entityクラスからテーブルを自動作成・更新）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JDBC URL の末尾にタイムゾーン指定を付与（未付与の場合）
spring.datasource.url=jdbc:postgresql://localhost:5432/goldfish_db?serverTimezone=Asia/Tokyo

# Jackson (JSON変換) での日時出力フォーマットとタイムゾーン
spring.jackson.time-zone=Asia/Tokyo
spring.jackson.date-format=yyyy/MM/dd HH:mm:ss

# LINE API Settings (実際の値は .env から注入)
line.bot.channel-token=${LINE_TOKEN:dummy}
line.bot.user-id=${LINE_USER:dummy}