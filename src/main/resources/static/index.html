<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金魚 水質管理システム</title>
    <!-- Chart.js 公式CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CSSを外部ファイルとして読み込み -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <h1>🐠 金魚 水質チェック＆ログ管理</h1>
      <!-- index.html の <h1> タグのすぐ下あたりに追記 -->
      <div style="text-align: right; margin-bottom: 16px">
        <a
          href="/tanks.html"
          style="text-decoration: none; font-weight: bold; color: #2b6cb0"
          >⚙️ 水槽の追加・管理はこちら ➔</a
        >
      </div>
    </header>

    <main>
      <!-- ① 水槽選択 ＆ 現在の水質ステータス（最上部） -->
      <section class="card current-status-card">
        <div style="margin-bottom: 1rem">
          <label for="tankSelect" style="font-weight: bold; margin-right: 8px"
            >対象水槽:</label
          >
          <select
            id="tankSelect"
            style="
              padding: 8px 12px;
              border-radius: 6px;
              border: 1px solid #bcccdc;
              font-size: 1rem;
            "
          ></select>
        </div>

        <div class="status-header">
          <h2 style="margin: 0; font-size: 1.15rem">現在の水質状況</h2>
          <span
            class="last-updated"
            id="lastUpdatedText"
            style="font-size: 0.85rem; color: #718096"
            >測定待機中...</span
          >
        </div>

        <!-- 水温 & pH の大型数値カード -->
        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-label">現在の水温</span>
            <div class="metric-value-wrap">
              <span class="metric-value" id="currentTemp">--.-</span>
              <span class="metric-unit">℃</span>
            </div>
            <span class="status-badge" id="badgeTemp">判定中</span>
          </div>

          <div class="metric-card">
            <span class="metric-label">現在のpH</span>
            <div class="metric-value-wrap">
              <span class="metric-value" id="currentPh">-.--</span>
            </div>
            <span class="status-badge" id="badgePh">判定中</span>
          </div>
        </div>

        <!-- グラフ展開トグルボタン -->
        <button type="button" id="toggleChartBtn" class="btn-toggle-chart">
          📈 過去の推移グラフを表示する
        </button>
      </section>

      <!-- ② 水質推移グラフ表示カード（初期状態は非表示: is-hidden） -->
      <section id="chartSection" class="card is-hidden">
        <h2>📈 水質推移ダッシュボード</h2>
        <div style="position: relative; height: 320px; width: 100%">
          <canvas id="waterChart"></canvas>
        </div>
        <div
          class="maintenance-box"
          style="
            margin: 20px 0 0 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
          "
        >
          <h3>🪣 メンテナンス記録</h3>
          <!-- ※ 対象水槽プルダウンと連動して自動設定されます -->
          <input type="hidden" id="maint-tank-id" value="1" />

          <select id="maint-action">
            <option value="換水">換水</option>
            <option value="掃除">フィルター掃除</option>
          </select>

          <select id="maint-scale">
            <option value="足し水">足し水のみ</option>
            <option value="1/4">1/4 換水</option>
            <option value="1/3">1/3 換水</option>
            <option value="半分">半分 換水</option>
            <option value="全換水">全換水（リセット）</option>
          </select>

          <input
            type="text"
            id="maint-memo"
            placeholder="メモ（青水対策など）"
            style="width: 200px"
          />
          <button type="button" id="btn-submit-maint">記録する</button>
        </div>
      </section>

      <!-- ③ 手動測定入力カード -->
      <section class="card">
        <h2>手動測定データの記録</h2>
        <form id="waterForm" class="form-group">
          <div>
            <label for="tempInput">水温 (℃):</label>
            <input
              type="number"
              id="tempInput"
              step="0.1"
              placeholder="24.0"
              required
            />
          </div>
          <div>
            <label for="phInput">pH:</label>
            <input
              type="number"
              id="phInput"
              step="0.1"
              placeholder="7.2"
              required
            />
          </div>
          <button type="submit">診断＆記録</button>
        </form>
        <div id="resultMessage" class="alert-box"></div>
      </section>

      <!-- ④ 履歴一覧カード -->
      <section class="card">
        <h2>測定履歴ログ一覧</h2>
        <table>
          <thead>
            <tr>
              <th>測定日時</th>
              <th>水温</th>
              <th>pH</th>
              <th>診断ステータス</th>
            </tr>
          </thead>
          <tbody id="logTableBody">
            <!-- JSがここに動的に追加 -->
          </tbody>
        </table>
      </section>
    </main>

    <!-- モダンJSの読み込み -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
